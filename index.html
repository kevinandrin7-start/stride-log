<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stride Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14202e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Stride Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one-screen phone app. Sticky header, scrolling view, fixed bottom tab bar. Bib-number type for figures. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e3e8ee; --ink:#14202e; --muted:#5b6878; --line:#d3dae3;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --good:#1d8a4f; --good-soft:#dcf1e5; --warn:#b36a00; --warn-soft:#fbecd3; --bad:#c2352b; --bad-soft:#f8dedb;
  --z1:#8aa0b8; --z2:#2e9e5b; --z3:#d9a400; --z4:#e2701d; --z5:#cf3a2e;
  --run:#1f4fd1; --walk:#2e9e5b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --surface:#16202b; --surface-2:#1f2b38; --ink:#e8eef5; --muted:#93a1b2; --line:#2a3846;
  --accent:#6f95ff; --accent-ink:#0b1424; --accent-soft:#1c2c50;
  --good:#4cc683; --good-soft:#163527; --warn:#f0a83a; --warn-soft:#3a2a10; --bad:#ff7a6e; --bad-soft:#3d1a17;
  --z1:#7d93ab; --z2:#4cc683; --z3:#f0c43a; --z4:#ff9147; --z5:#ff6b5e; --run:#6f95ff; --walk:#4cc683;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --surface:#16202b; --surface-2:#1f2b38; --ink:#e8eef5; --muted:#93a1b2; --line:#2a3846;
  --accent:#6f95ff; --accent-ink:#0b1424; --accent-soft:#1c2c50;
  --good:#4cc683; --good-soft:#163527; --warn:#f0a83a; --warn-soft:#3a2a10; --bad:#ff7a6e; --bad-soft:#3d1a17;
  --z1:#7d93ab; --z2:#4cc683; --z3:#f0c43a; --z4:#ff9147; --z5:#ff6b5e; --run:#6f95ff; --walk:#4cc683;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font:800 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.local i{background:var(--warn)}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero h2{font:700 34px/1.02 var(--display);text-transform:uppercase;letter-spacing:.01em}
.hero .detail{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hero .chip{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.chip.z2{background:var(--z2);color:#fff}.chip.z3{background:var(--z3);color:#1a1300}.chip.z4{background:var(--z4);color:#fff}.chip.z5{background:var(--z5);color:#fff}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2);color:var(--ink);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.hero .btn{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.hero .btn.primary{background:var(--bg);color:var(--ink)}
.btn.grow{flex:1 1 0}
.btn.small{padding:8px 12px;min-height:36px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-size:28px;line-height:1}
.stat .lbl{font-size:12px;color:var(--muted)}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dcell{border:0;background:var(--surface-2);border-radius:10px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dcell .dn{font-size:11px;color:var(--muted);font-weight:600}
.dcell .dd{font:700 18px/1 var(--display)}
.dcell .dk{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcell.today{outline:2px solid var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:transparent;border:2px solid var(--line)}
.dot.plan{border-color:var(--muted)}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.partial{background:var(--warn);border-color:var(--warn)}
.dot.skipped,.dot.missed{background:var(--bad);border-color:var(--bad)}
.coach{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border-left:0}
.coach .sev{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 15px/1 var(--display)}
.coach.good .sev{background:var(--good-soft);color:var(--good)}
.coach.warn .sev{background:var(--warn-soft);color:var(--warn)}
.coach.bad .sev{background:var(--bad-soft);color:var(--bad)}
.coach.info .sev{background:var(--accent-soft);color:var(--accent)}
.coach .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.coach b{font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.li .date{width:44px;flex:none;text-align:center}
.li .date .d1{font:700 20px/1 var(--display)}
.li .date .d2{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.phasehead{display:flex;flex-direction:column;gap:4px;padding:6px 2px 0}
.phasehead h3{font:700 22px/1.05 var(--display);text-transform:uppercase}
.wk{background:var(--surface);border-radius:var(--r);overflow:hidden}
.wk > button.wkh{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left}
.wkh .wn{font:800 26px/1 var(--display);width:40px;flex:none}
.wkh .meta{flex:1;min-width:0}
.wkh .meta .t{font-weight:600}
.wkh .meta .s{font-size:13px;color:var(--muted)}
.wk.current{outline:2px solid var(--accent)}
.wkbody{padding:0 14px 8px}
.pdots{display:flex;gap:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.tab{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font:700 28px/1.05 var(--display);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%;box-sizing:border-box;min-height:46px;-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field input,.field select{height:46px}
.field input[type=date],.field input[type=time]{display:block;text-align:left;line-height:22px}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
.field .val{min-height:46px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rpe button{padding:9px 0;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--display);font-size:16px}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* timer */
.timer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--run);color:#fff;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));gap:12px;transition:background .3s}
.timer.walk{background:var(--walk)}
.timer.done{background:var(--ink);color:var(--bg)}
.timer .seglabel{font:800 64px/0.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.timer .clock{font:700 min(30vw,150px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer .tmeta{display:flex;justify-content:space-between;gap:10px;font-size:15px;opacity:.92}
.timer .tbar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.timer .tbar i{display:block;height:100%;background:#fff}
.timer .tbtns{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-top:auto}
.timer .tbtns button{border:0;border-radius:14px;min-height:60px;font-weight:700;font-size:16px;background:rgba(255,255,255,.2);color:inherit}
.timer .tbtns button.main{background:#fff;color:#111}
.timer .next{font-size:16px}
.timer .grow{flex:1}
.segs{display:flex;gap:2px;height:14px}
.segs i{display:block;border-radius:3px;background:rgba(255,255,255,.35)}
.segs i.r{background:rgba(255,255,255,.6)}
.segs i.past{opacity:.35}
.segs i.cur{outline:2px solid #fff}
/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart{position:relative}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chart .big{font:700 22px/1.1 var(--body);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:600 12px/1.3 var(--body);padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.xh{pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
table.zt{width:100%;border-collapse:collapse;font-size:14px}
table.zt td{padding:7px 4px;border-top:1px solid var(--line)}
table.zt td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.zsw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40}
.ms{display:flex;flex-direction:column;gap:10px}
.msrow{display:flex;align-items:center;gap:12px}
.msrow .num{font-size:30px;width:64px;line-height:1}
.msrow .meta{flex:1;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.field .opt input{width:20px;height:20px;min-height:0;padding:0;border:0;margin-top:1px;accent-color:var(--accent);flex:none;-webkit-appearance:auto;appearance:auto}
.opt .s{display:block;font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;border-radius:9px;min-height:38px;font-weight:700;background:transparent;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.mem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.mem .meta{flex:1;min-width:0}.mem .meta b,.mem .meta .s{display:block}.mem .meta .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{font:700 26px/1 var(--display);letter-spacing:.12em}
.imp{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.imp .wv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.imp .wv div{background:var(--surface);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.imp .wv b{font:700 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.imp .wv span{font-size:11px;color:var(--muted)}
.shots{display:flex;gap:8px;overflow-x:auto}
.shots img{height:150px;width:auto;border-radius:10px;border:1px solid var(--line);flex:none}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.todo{display:flex;flex-direction:column;gap:2px}
.todo .check{padding:12px 4px;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.todo .check:last-child{border-bottom:0}
.todo .check input{width:26px;height:26px;margin-top:0;flex:none}
.todo .check .s{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.todo .check.on .t{text-decoration:line-through;opacity:.6}
.cd{display:flex;align-items:baseline;gap:10px}
.cd .num{font-size:64px;line-height:.9}
.hist .li{cursor:default}
.hrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;background:var(--surface-2);color:var(--muted)}
.hrow .ic.done{background:var(--good,#22c55e);color:#fff}
.hrow .ic.partial{background:var(--warn,#f59e0b);color:#fff}
.hrow .ic.missed{background:transparent;border:1.5px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Stride<span>Log</span></div>
    <div class="sync" id="sync"><i></i><span>Loading</span></div>
  </header>
  <main id="app" class="view">
    <div class="card"><div class="eyebrow">Loading your plan</div></div>
  </main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">

  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>

</div></nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script>
(function(){
"use strict";
/* ---------- Plan data (from Kevin's 30-week Couch to Marathon plan) ---------- */
const DEFAULTS={startDate:"2026-11-09",maxHr:192,restHr:null,repeats:[]};

/* ---------- personalizing the plan from a profile ---------- */
const LEVELS=[
  {t:"Just starting",s:"Can't jog 5 minutes without stopping yet"},
  {t:"Run-walk",s:"Can run-walk for 20 to 30 minutes"},
  {t:"Runner",s:"Can run 30 minutes without stopping"},
  {t:"Regular runner",s:"Already run 15+ miles a week"}
];
const P1_0={
  1:{easy:{reps:10,run:1,walk:1},long:25,lr:1},
  2:{easy:{reps:8,run:2,walk:1},long:28,lr:2},
  3:{easy:{reps:6,run:3,walk:1},long:30,lr:3},
  4:{easy:{reps:6,run:2,walk:1},long:25,lr:2,cut:true},
  5:{easy:{reps:5,run:4,walk:1},long:32,lr:4},
  6:{easy:{reps:4,run:6,walk:1},long:35,lr:6},
  7:{easy:{reps:3,run:8,walk:1},long:38,lr:8},
  8:{bench:true,bmin:20,emin:20,long:35}
};
function p1For(w,lvl){
  if(lvl===0)return P1_0[w];
  if(lvl!==2&&lvl!==3)return P1[w];
  const E=lvl===2?[25,28,30,25,32,35,38]:[35,38,40,32,42,45,48];
  const L=lvl===2?[35,40,45,35,48,50,55]:[50,55,60,45,65,70,75];
  if(w===8)return {bench:true,bmin:lvl===2?40:45,emin:lvl===2?35:40,long:lvl===2?60:80,cont:true};
  return {easy:{custom:[["run",E[w-1]]],desc:E[w-1]+" min easy run"},long:L[w-1],lr:L[w-1],cont:true,cut:w===4};
}
function bmiOf(p){const h=(+p.heightFt||0)*12+(+p.heightIn||0),w=+p.weightLb||0;return h>40&&w>50?Math.round(w*703/(h*h)*10)/10:null}
function estMaxHr(p){const a=+p.age||0;if(!a)return null;return Math.round(p.sex==="female"?206-0.88*a:208-0.7*a)}
function planParams(s){
  const p=s&&s.profile;if(!p)return {lvl:1,mult:1};
  let lvl=+p.level;if(!(lvl>=0&&lvl<=3))lvl=1;
  let m=[0.85,1,1.15,1.3][lvl];const age=+p.age||0;
  if(age>=60)m-=0.15;else if(age>=50)m-=0.1;
  const bmi=bmiOf(p);if(bmi&&bmi>=30)m-=0.1;
  m=Math.max(0.75,Math.min(1.3,m));
  return {lvl,mult:Math.round(m*100)/100,bmi};
}

/* ---------- date helpers (local dates as YYYY-MM-DD) ---------- */
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmt(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function todayStr(){return fmt(new Date())}
function nice(s,opt){const d=parse(s);return (opt&&opt.dow?DOW[d.getDay()]+", ":"")+MON[d.getMonth()]+" "+d.getDate()+(opt&&opt.year?", "+d.getFullYear():"")}

/* ---------- zones ---------- */
function zones(max){
  const z2lo=Math.round(.65*max),z2hi=Math.round(.75*max),z3hi=Math.round(.85*max),z4hi=Math.round(.92*max);
  return {z1:[0,z2lo-1],z2:[z2lo,z2hi],z3:[z2hi+1,z3hi],z4:[z3hi+1,z4hi],z5:[z4hi+1,max],me:[z2hi-4,z2hi+6]};
}
function zoneLabel(k,Z){const r=Z[k];if(!r)return "";if(k==="z1")return "Zone 1 · under "+(r[1]+1);
  if(k==="me")return "Marathon effort · "+r[0]+"–"+r[1];return "Zone "+k[1]+" · "+r[0]+"–"+r[1]}

/* ---------- build the schedule ---------- */
function splitMiles(total,n){ // into 0.5 mi steps that sum close to total
  if(n<=0)return [];const base=Math.floor((total/n)*2)/2;const arr=Array(n).fill(base);
  let rem=Math.round((total-base*n)*2)/2;let i=0;while(rem>=0.5&&i<n*3){arr[i%n]+=0.5;rem-=0.5;i++}
  return arr.map(x=>Math.max(x,2));
}
function runWalk(totalMin,run,walk){
  const segs=[];let t=0;
  while(t<totalMin){const r=Math.min(run,totalMin-t);segs.push(["run",r]);t+=r;if(t+walk<totalMin){segs.push(["walk",walk]);t+=walk}else break}
  return segs;
}
function withWarm(segs){return [["warm",5]].concat(segs,[["cool",5]])}
function buildPlan(settings){
  const PP=planParams(settings),sc=v=>Math.max(2,Math.round(v*PP.mult*2)/2),scL=v=>Math.max(2,Math.round(v*Math.max(0.9,PP.mult)*2)/2);
  const reps=(settings.repeats||[]).slice().sort((a,b)=>a-b);
  const seq=[];for(let w=1;w<=30;w++){seq.push({w,rep:false});reps.filter(r=>r===w).forEach(()=>seq.push({w,rep:true}))}
  const days=[],weeks=[];
  seq.forEach((slot,i)=>{
    const start=addDays(settings.startDate,i*7);const w=slot.w;
    const phase=w<=8?1:w<=14?2:3;
    const wk={slot:i+1,w,rep:slot.rep,start,phase,tag:"",note:"",days:[],unit:phase===1?"min":"mi",planned:0};
    const mk=(dow,o)=>{const date=addDays(start,(dow+6)%7);const d=Object.assign({date,w,slot:i+1,phase,dow,kind:"rest",title:"Rest",detail:"",strength:false,optional:false},o);wk.days.push(d);days.push(d);return d};
    if(phase===1){
      const p=p1For(w,PP.lvl);wk.tag=p.cut?"cutback":p.bench?"benchmark":"";
      const bmin=p.bmin||30,emin=p.emin||25,blong=p.bench?(p.long||45):0;
      const easySegs=p.bench?null:(p.easy.custom?p.easy.custom:[].concat(...Array(p.easy.reps).fill([["run",p.easy.run],["walk",p.easy.walk]])).slice(0,-1));
      const easyDesc=p.bench?"":p.easy.desc?p.easy.desc:p.easy.custom?"20 min jog, 1 min walk, 12 min jog":p.easy.reps+" × ("+p.easy.run+" min jog, "+p.easy.walk+" min walk)";
      const easyMin=easySegs?easySegs.reduce((a,s)=>a+s[1],0):25;
      const strides=w>=3?" Then 4–6 relaxed 20 s strides at about 7.0–7.5 mph with full recovery.":"";
      wk.note=p.cut?"Cutback week: lighter so your legs absorb the last three weeks.":p.bench?"Benchmark week: one "+bmin+"-minute continuous run in Zone 2.":p.cont?"Run easy in Zone 2 the whole way. If HR passes the ceiling, slow down or walk briefly until it settles.":"Jog in Zone 2. If HR passes the Zone 2 ceiling, walk until it drops about 14 bpm, then resume.";
      mk(1,{kind:"rest",title:"Rest"});
      if(p.bench){
        mk(2,{kind:"easy",title:"Benchmark: "+bmin+" min continuous",detail:bmin+" minutes of continuous running in Zone 2. Walk 5 min before and after.",minutes:bmin,segs:withWarm([["run",bmin]]),strength:true,hr:"z2"});
        mk(3,{kind:"easy",title:"Easy run "+emin+" min",detail:emin+" minutes easy. Walk breaks if HR drifts high."+strides,minutes:emin,segs:withWarm([["run",emin]]),hr:"z2"});
        mk(5,{kind:"easy",title:"Easy run "+emin+" min",detail:emin+" minutes easy.",minutes:emin,segs:withWarm([["run",emin]]),strength:true,hr:"z2"});
      }else{
        const et=p.cont?"Easy run "+easyMin+" min":"Easy run-walk";
        mk(2,{kind:"easy",title:et,detail:easyDesc+".",minutes:easyMin,segs:withWarm(easySegs),strength:true,hr:"z2"});
        mk(3,{kind:"easy",title:et,detail:easyDesc+"."+strides,minutes:easyMin,segs:withWarm(easySegs),hr:"z2"});
        mk(5,{kind:"easy",title:et,detail:easyDesc+".",minutes:easyMin,segs:withWarm(easySegs),strength:true,hr:"z2"});
      }
      mk(4,{kind:"cross",title:"Rest or cross-train",detail:"Rest, or 30 min easy bike, row, elliptical or swim in Zone 2.",optional:true});
      const lsegs=p.bench||p.cont?[["run",p.long]]:runWalk(p.long,p.lr,1);
      mk(6,{kind:"long",title:(p.cont?"Long run ":"Long run-walk ")+p.long+" min",detail:p.bench?p.long+" minutes easy. Walk breaks are fine.":p.cont?p.long+" minutes easy in Zone 2.":p.long+" minutes of "+p.lr+" min jog / 1 min walk.",minutes:p.long,segs:withWarm(lsegs),hr:"z2"});
      mk(0,{kind:"cross",title:"Walk or bike",detail:"30 to 45 min easy walk or bike ride.",optional:true});
      wk.planned=wk.days.filter(d=>RUNKINDS[d.kind]).reduce((a,d)=>a+d.minutes,0);
    }else if(phase===2){
      const [tot0,lg0,note,cut]=P2[w];const tot=sc(tot0),lg=Math.min(20,scL(lg0));wk.tag=cut?"cutback":"";wk.note=note;
      const raceWk=w===12;const quality=w>=13;
      const longMi=raceWk?3.6:lg;const ez=splitMiles(tot-longMi,3);
      mk(1,{kind:"rest",title:"Rest"});
      mk(2,{kind:"easy",title:"Easy run "+ez[0]+" mi + strides",detail:ez[0]+" mi easy, then 4–6 × 20 s strides.",miles:ez[0],strength:true,hr:"z2"});
      if(quality)mk(3,{kind:"quality",title:"Quality "+ez[1]+" mi",detail:ez[1]+" mi including 2 × 8 min in Zone 3, 3 min easy between.",miles:ez[1],hr:"z3"});
      else mk(3,{kind:"easy",title:"Easy run "+ez[1]+" mi",detail:ez[1]+" mi easy, conversational pace.",miles:ez[1],hr:"z2"});
      mk(4,{kind:"cross",title:"Rest or cross-train",detail:"Rest, or 30 min easy cross-training.",optional:true});
      mk(5,{kind:"strength",title:"Strength",detail:"20 to 30 min strength session.",strength:true});
      if(raceWk)mk(6,{kind:"race",title:"5K race",detail:"Your first race! Local 5K or parkrun. Jog 0.5 mi to warm up, start easy, finish strong.",miles:3.6,race:"5K",hr:"z3"});
      else mk(6,{kind:"long",title:"Long run "+lg+" mi",detail:lg+" mi in Zone 2. Walk breaks allowed whenever HR passes the ceiling.",miles:lg,hr:"z2"});
      mk(0,{kind:"easy",title:"Easy run "+ez[2]+" mi",detail:ez[2]+" mi easy.",miles:ez[2],hr:"z2"});
      wk.planned=Math.round(wk.days.reduce((a,d)=>a+(RUNKINDS[d.kind]&&d.miles||0),0)*10)/10;
    }else{
      const [tot0,lg0,qtxt,qmi,qz,lnote,tag]=P3[w];const fixed=w===22||w===30;const lg=fixed?lg0:Math.min(20,scL(lg0));const tot=fixed?tot0:Math.max(sc(tot0),lg+qmi+4);wk.tag=tag||"";
      const five=w>=19;const lateStrength=w>=28;
      mk(1,{kind:"rest",title:"Rest"});
      if(w===30){
        wk.note="Race week. Keep it short and easy, sleep well, and lay out your gear on Friday.";
        mk(2,{kind:"easy",title:"Easy run 3 mi",detail:"3 mi easy.",miles:3,hr:"z2"});
        mk(3,{kind:"quality",title:"3 mi with strides",detail:"3 mi easy with 4 × 20 s strides.",miles:3,strength:true,hr:"z2"});
        mk(4,{kind:"rest",title:"Rest"});
        mk(5,{kind:"easy",title:"Shakeout 2 mi",detail:"2 mi very easy to stay loose.",miles:2,hr:"z1"});
        mk(6,{kind:"rest",title:"Rest",detail:"Rest, hydrate, carb-load. Pick up your bib."});
        mk(0,{kind:"race",title:"Marathon",detail:"Race day. Start slower than feels right, stay in Zone 2 for the first half, take a gel every 30 to 40 min.",miles:26.2,race:"Marathon",hr:"me"});
        wk.planned=9+26.2;
      }else{
        const raceWk=w===22;
        const easyDays=five?3:2;
        const rest=tot-lg-(raceWk?0:qmi);const ez=splitMiles(rest,raceWk?3:easyDays);
        wk.note=raceWk?"Cutback week with your half marathon on Saturday. Its result sets your marathon effort.":tag==="cutback"?"Cutback week: lighter so you absorb the training.":tag==="peak"?"Peak week: your longest run, "+lg+" mi. Fuel every 30 to 40 min.":tag==="taper"?"Taper: volume drops while some intensity stays.":"Long run in Zone 2. Fuel on anything over 75 minutes.";
        let k=0;
        if(raceWk)mk(2,{kind:"easy",title:"Easy run "+ez[k]+" mi",detail:ez[k]+" mi easy.",miles:ez[k++],hr:"z2"});
        else mk(2,{kind:"quality",title:qtxt.split(":")[0],detail:qtxt+(qz==="me"?". Marathon effort is about high Zone 2 to low Zone 3.":"."),miles:qmi,hr:qz==="easy"?"z2":qz});
        mk(3,{kind:"easy",title:"Easy run "+ez[k]+" mi",detail:ez[k]+" mi easy.",miles:ez[k++],strength:true,hr:"z2"});
        if(five&&!raceWk)mk(4,{kind:"easy",title:"Easy run "+ez[k]+" mi",detail:ez[k]+" mi easy.",miles:ez[k++],hr:"z2"});
        else mk(4,{kind:"cross",title:"Rest or cross-train",detail:"Rest, or 30 min easy cross-training.",optional:true});
        mk(5,{kind:lateStrength?"rest":"strength",title:lateStrength?"Rest":"Strength",detail:lateStrength?"":"20 to 30 min strength session.",strength:!lateStrength});
        if(raceWk)mk(6,{kind:"race",title:"Half marathon",detail:"Race or a 10 mi run. Run the first half easy. Your finishing pace sets marathon effort for the block.",miles:13.1,race:"Half marathon",hr:"z3"});
        else mk(6,{kind:"long",title:"Long run "+lg+" mi",detail:lg+" mi in Zone 2"+(lnote?", "+lnote:"")+". Run-walk is fine (9 min run, 1 min walk). Stop at 3.5 hours.",miles:lg,hr:"z2"});
        mk(0,{kind:"easy",title:"Recovery run "+ez[k]+" mi",detail:ez[k]+" mi very easy.",miles:ez[k++],hr:"z1"});
        wk.planned=Math.round(wk.days.reduce((a,d)=>a+(RUNKINDS[d.kind]&&d.miles||0),0)*10)/10;
      }
    }
    wk.days.sort((a,b)=>a.date<b.date?-1:1);
    weeks.push(wk);
  });
  days.sort((a,b)=>a.date<b.date?-1:1);
  const byDate={};days.forEach(d=>byDate[d.date]=d);
  const find=r=>days.find(d=>d.race===r);
  return {days,weeks,byDate,end:days[days.length-1].date,milestones:[{name:"5K",date:find("5K").date,dist:"3.1 mi"},{name:"Half marathon",date:find("Half marathon").date,dist:"13.1 mi"},{name:"Marathon",date:find("Marathon").date,dist:"26.2 mi"}]};
}

/* ---------- state + storage ---------- */
const LS="stridelog.v1";
let S={settings:Object.assign({},DEFAULTS),logs:{},daily:{},sync:"loading"};
let PLAN=buildPlan(S.settings);
let db=null,downloads=null,sampler=null,assets=null,canImg=false;
let tab="today",openWeek=null;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({settings:S.settings,logs:S.logs}))}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){S.settings=Object.assign({},DEFAULTS,r.settings||{});S.logs=r.logs||{}}}catch(e){}}
function setSync(k){S.sync=k;const el=document.getElementById("sync");el.className="sync "+(k==="ok"?"ok":k==="local"?"local":"");
  el.querySelector("span").textContent=k==="ok"?"Synced":k==="local"?"This device only":k==="saving"?"Saving":"Loading"}
const CFG=window.STRIDE_CONFIG||{};
let tok=null,canPush=false,visHooked=false;
const UIDK="stridelog.uid";
const isOwner=()=>!!(S.me&&S.me.role==="owner");
function nextMonday(from){const d=parse(from||todayStr());const add=(8-d.getDay())%7||7;d.setDate(d.getDate()+add);return fmt(d)}
function mondayOnOrAfter(v){const d=parse(v);const add=(8-d.getDay())%7;d.setDate(d.getDate()+add);return fmt(d)}
function freshSettings(){return {startDate:nextMonday(),maxHr:190,restHr:null,repeats:[]}}
function resetLocal(){S.logs={};S.daily={};S.settings=freshSettings();S.me=null;S.admin=null;PLAN=buildPlan(S.settings);try{localStorage.removeItem(LS);localStorage.removeItem("stridelog.push")}catch(e){}}
try{tok=localStorage.getItem("stridelog.token")}catch(e){}
const API=()=>String(CFG.apiUrl||"").replace(/\/$/,"");
async function call(path,opt){opt=opt||{};const h=Object.assign({},opt.headers||{});if(tok)h.Authorization="Bearer "+tok;
  const r=await fetch(API()+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&tok){setToken(null);db=null;sampler=null;assets=null;canImg=false;setSync("local");render();showSignIn("Please sign in again.")}
  return r}
function setToken(t){tok=t;try{if(t)localStorage.setItem("stridelog.token",t);else localStorage.removeItem("stridelog.token")}catch(e){}}
const docPath=(c,i)=>"/docs/"+encodeURIComponent(c)+"/"+encodeURIComponent(i);
async function upsertDoc(coll,id,data){const r=await call(docPath(coll,id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(!r.ok)throw new Error("save failed")}
async function getDocs(colls){const r=await call("/docs?coll="+colls.join(","));if(!r.ok)throw new Error("load failed");return (await r.json()).docs}
async function writeLog(date,log){
  if(log)S.logs[date]=log;else delete S.logs[date];saveLocal();render();scheduleReminders();
  if(!db)return;
  try{setSync("saving");
    if(log)await upsertDoc("logs",date,log);
    else{const r=await call(docPath("logs",date),{method:"DELETE"});if(!r.ok)throw 0}
    setSync("ok")}
  catch(e){setSync("local");toast("Saved on this phone. Sync will retry next time.")}
}
async function writeSettings(patch){
  S.settings=Object.assign({},S.settings,patch);PLAN=buildPlan(S.settings);saveLocal();render();scheduleReminders();
  if(!db)return;
  try{setSync("saving");await upsertDoc("settings","main",S.settings);setSync("ok")}catch(e){setSync("local")}
}
async function pull(){
  if(!db)return;
  let rows;try{rows=await getDocs(["logs","daily","settings"])}catch(e){setSync("local");return}
  const remote={},daily={};let settings=null;
  rows.forEach(r=>{if(r.coll==="logs")remote[r.id]=r.data;else if(r.coll==="daily")daily[r.id]=r.data;else if(r.id==="main")settings=r.data});
  // push anything logged on this phone while offline
  const push=Object.keys(S.logs).filter(k=>!remote[k]||(S.logs[k].updatedAt||0)>(remote[k].updatedAt||0));
  for(const k of push){try{await upsertDoc("logs",k,S.logs[k]);remote[k]=S.logs[k]}catch(e){}}
  S.logs=remote;S.daily=daily;
  if(settings){S.settings=Object.assign({},DEFAULTS,settings);PLAN=buildPlan(S.settings)}
  else if(isOwner()){try{await upsertDoc("settings","main",S.settings)}catch(e){}}
  else{S.settings=Object.assign(freshSettings(),{remindTime:S.settings.remindTime||null});PLAN=buildPlan(S.settings)}
  saveLocal();setSync("ok");render();scheduleReminders();
  if(S.me&&!isOwner()&&!S.settings.profile&&!$("#scrim"))openProfile(true);
}
async function connect(){
  if(!CFG.apiUrl){setSync("local");return}
  if(!tok){setSync("local");render();showSignIn();return}
  await onSignedIn();
}
async function onSignedIn(){
  try{const r=await call("/me");if(r.ok){S.me=(await r.json()).user;try{const old=localStorage.getItem(UIDK);if(old&&old!==S.me.id){const keep=S.me;resetLocal();S.me=keep}localStorage.setItem(UIDK,S.me.id)}catch(e){}}}catch(e){}
  if(!tok)return;
  db={};sampler={json:readShots};canImg=true;assets={upload:uploadShot};
  canPush=("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
  if(!visHooked){visHooked=true;document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}
  await pull();
}
function showSignIn(msg,mode){
  if(!CFG.apiUrl){toast("Sync isn't set up yet");return}
  mode=mode||"in";
  const up=mode==="up";
  const s=openSheet('<div class="eyebrow">Stride Log</div><h2>'+(up?"Create your account":"Sign in")+'</h2>'+
    '<div class="seg" role="group"><button id="mIn" aria-pressed="'+!up+'">Sign in</button><button id="mUp" aria-pressed="'+up+'">New account</button></div>'+

/* screenshots: shrink on the phone, read on the server */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}
  finally{URL.revokeObjectURL(url)}
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function readShots(prompt,opt){
  const images=[];for(const f of opt.images){const b=await shrink(f);images.push({type:"image/jpeg",data:await b64(b)})}
  const res=await call("/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,images})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok){const e=new Error(j.error||"api_error");e.code=j.error;throw e}
  return j.result;
}
async function uploadShot(file){
  const b=await shrink(file);
  const r=await call("/shots",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:b});if(!r.ok)throw 0;
  return {id:(await r.json()).id};
}

/* reminders: the phone lists the next 3 weeks of sessions, the server pushes them */
async function scheduleReminders(){
  if(!db)return;const t=S.settings.remindTime;const items=[];
  if(t){const [hh,mm]=t.split(":").map(Number);const today=todayStr();
    for(let i=0;i<21;i++){const ds=addDays(today,i);const d=PLAN.byDate[ds];
      if(!d||!(RUNKINDS[d.kind]||d.strength||d.kind==="strength")||S.logs[ds])continue;
      const dt=parse(ds);dt.setHours(hh,mm,0,0);if(dt.getTime()<Date.now()-60e3)continue;
      items.push({id:ds+"@"+t,at:dt.getTime(),title:(d.race?"Race day: ":"Today: ")+d.title,body:String(d.detail||"Open Stride Log for today's session.").slice(0,180)})}}
  const sig=JSON.stringify(items);if(sig===scheduleReminders.last)return;scheduleReminders.last=sig;
  try{let sent=[];try{const rows=await getDocs(["reminders"]);const r=rows.find(x=>x.id==="upcoming");if(r&&r.data.sent)sent=r.data.sent}catch(e){}
    await upsertDoc("reminders","upcoming",{items,sent,tz:Intl.DateTimeFormat().resolvedOptions().timeZone})}catch(e){scheduleReminders.last=null}
}
async function enablePush(){
  if(!canPush){toast("Add Stride Log to your Home Screen, open it from there, then try again.");return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Notifications are off. Turn them on in iPhone Settings > Notifications > Stride Log.");return}
    const reg=await navigator.serviceWorker.ready;
    const {publicKey}=await (await fetch(API()+"/vapid")).json();
    const pad="===".slice((publicKey.length+3)%4);
    const key=Uint8Array.from(atob(publicKey.replace(/-/g,"+").replace(/_/g,"/")+pad),c=>c.charCodeAt(0));
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    const r=await call("/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sub:sub.toJSON()})});
    if(!r.ok)throw 0;
    try{localStorage.setItem("stridelog.push","1")}catch(e){}
    if(!S.settings.remindTime)writeSettings({remindTime:"17:30"});else render();
    toast("Reminders are on");
  }catch(e){toast("Couldn't turn on reminders. Try again.")}
}

/* ---------- analytics ---------- */
function statusOf(d,today){const l=S.logs[d.date];if(l)return l.status;if(d.date<today&&RUNKINDS[d.kind])return "missed";return "plan"}
function weekStats(wk,today){
  const runs=wk.days.filter(d=>RUNKINDS[d.kind]);
  const due=runs.filter(d=>d.date<=today);
  const done=runs.filter(d=>{const l=S.logs[d.date];return l&&(l.status==="done"||l.status==="partial")});
  let vol=0;wk.days.forEach(d=>{const l=S.logs[d.date];if(l&&l.status!=="skipped"){vol+=wk.unit==="mi"?(+l.distance||0):(+l.minutes||0)}});
  const str=wk.days.filter(d=>d.strength);const strDone=str.filter(d=>{const l=S.logs[d.date];return l&&l.strength}).length;
  return {runs:runs.length,due:due.length,done:done.length,vol:Math.round(vol*10)/10,planned:wk.planned,str:str.length,strDone};
}
function currentWeek(today){return PLAN.weeks.find(w=>today>=w.start&&today<=addDays(w.start,6))||null}
function streak(today){
  const runs=PLAN.days.filter(d=>RUNKINDS[d.kind]&&d.date<=today).reverse();let n=0;
  for(const d of runs){const l=S.logs[d.date];if(l&&(l.status==="done"||l.status==="partial"))n++;else if(d.date===today&&!l)continue;else break}
  return n;
}
function totals(){
  let mi=0,min=0,runs=0,longest=0,cal=0;
  Object.values(S.logs).forEach(l=>{if(l.status==="skipped")return;const dm=+l.distance||0;mi+=dm;min+=+l.minutes||0;if(dm||l.minutes)runs++;if(dm>longest)longest=dm;});
  const st=PLAN.days[0].date;Object.keys(S.daily||{}).forEach(k=>{if(k>=st)cal+=+(S.daily[k].active_cal)||0});
  let steps=0;Object.values(S.daily||{}).forEach(d=>{steps+=+d.steps||0});
  return {mi:Math.round(mi*10)/10,min:Math.round(min),runs,longest,cal:Math.round(cal),steps:Math.round(steps)};
}
function coach(today){
  const Z=zones(S.settings.maxHr),out=[];
  const past7=Object.keys(S.logs).filter(k=>k<=today&&diffDays(k,today)<7).sort().reverse();
  const pain=past7.map(k=>[k,S.logs[k]]).find(([k,l])=>l.pain&&l.pain!=="none"&&l.pain!=="sore");
  if(pain){const [k,l]=pain;
    if(l.pain==="sharp")out.push({sev:"bad",t:"Sharp bone pain logged on "+nice(k,{dow:1}),b:"Stop running and see a doctor. Pinpoint pain on a shin, foot or hip can be a stress fracture."});
    else if(l.pain==="worse")out.push({sev:"bad",t:"Pain that got worse on "+nice(k,{dow:1}),b:"Take 2 to 3 days off, then retry an easy run. Stop if it comes back."});
    else if(l.pain==="achilles")out.push({sev:"warn",t:"Achilles or heel pain logged",b:"Drop speed and hills, add calf raises, and see a physio if it lasts over a week."});
  }
  const easy=PLAN.days.filter(d=>(d.kind==="easy"||d.kind==="long")&&S.logs[d.date]&&+S.logs[d.date].avgHr>0&&d.date<=today).slice(-3);
  if(easy.length>=2){const avg=Math.round(easy.reduce((a,d)=>a+ +S.logs[d.date].avgHr,0)/easy.length);
    if(avg>Z.z2[1])out.push({sev:"warn",t:"Easy runs are running hot: "+avg+" bpm average",b:"Your last "+easy.length+" easy runs averaged above "+Z.z2[1]+". Slow down or walk more. Zone 2 feels slow at first, and that's the point."});
    else out.push({sev:"good",t:"Heart rate on target: "+avg+" bpm average",b:"Your recent easy runs are in Zone 2. Keep it there."});
  }
  const cw=currentWeek(today);
  if(cw){const idx=PLAN.weeks.indexOf(cw);const prev=PLAN.weeks[idx-1];
    if(prev){const st=weekStats(prev,today);
      if(st.runs&&st.done/st.runs<0.5&&!(S.settings.repeats||[]).includes(prev.w)){out.push({sev:"warn",t:"Last week: "+st.done+" of "+st.runs+" runs",b:"Missing one week costs little. If the week felt hard or you missed most of it, repeat it before moving on. Repeating pushes race day back one week.",action:{label:"Repeat week "+prev.w,fn:"repeat",w:prev.w}})}
    }
    const st=weekStats(cw,today);
    if(cw.unit==="mi"&&st.vol>cw.planned*1.15)out.push({sev:"warn",t:"You're "+Math.round((st.vol-cw.planned)*10)/10+" mi over plan this week",b:"Extra miles add injury risk faster than fitness. Your fitness will outrun your tendons for the first 6 months."});
    const missed=cw.days.filter(d=>RUNKINDS[d.kind]&&d.date<today&&!S.logs[d.date]);
    if(missed.length)out.push({sev:"info",t:"Not logged yet: "+missed.map(d=>DOW[d.dow]+" "+d.title).join(", "),b:"Tap a day in the week strip to log it, or mark it skipped.",day:missed[missed.length-1].date});
  }
  const s=streak(today);if(s>=4)out.push({sev:"good",t:s+" workouts in a row",b:"Consistency is what builds a marathoner. Keep stacking easy days."});
  return out.slice(0,4);
}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KLABEL={rest:"Rest",easy:"Easy",long:"Long",quality:"Hard",race:"Race",cross:"Cross",strength:"Gym"};
function zoneChip(hr){if(!hr)return "";const Z=zones(S.settings.maxHr);const cls=hr==="me"?"z3":hr==="z1"?"":hr;return '<span class="chip '+cls+'">'+esc(zoneLabel(hr,Z))+' bpm</span>'}
function dayChips(d){let c="";if(d.miles)c+='<span class="chip">'+d.miles+' mi</span>';if(d.minutes)c+='<span class="chip">'+d.minutes+' min'+(d.segs?' + 10 min walk':'')+'</span>';c+=zoneChip(d.hr);if(d.strength)c+='<span class="chip">+ Strength</span>';return c}
function logSummary(l){if(!l)return "";const p=[];if(l.status==="skipped")return "Skipped";if(l.distance)p.push(l.distance+" mi");if(l.minutes)p.push(l.minutes+" min");if(l.watch&&l.watch.pace)p.push(l.watch.pace+"/mi");if(l.avgHr)p.push(l.avgHr+" bpm");if(l.watch&&l.watch.active_cal)p.push(l.watch.active_cal+" cal");if(l.rpe)p.push("effort "+l.rpe+"/10");if(l.strength)p.push("strength ✓");return (l.status==="partial"?"Partial · ":"Done · ")+p.join(" · ")}
function weekStrip(wk,today){
  return '<div class="weekstrip">'+wk.days.map(d=>{const st=statusOf(d,today);const k=d.kind==="rest"?"Rest":d.kind==="cross"?(d.optional?"Opt":"Cross"):KLABEL[d.kind];

}
function weekTitle(wk){return "Week "+wk.w+(wk.rep?" (repeat)":"")+(wk.tag?" · "+wk.tag:"")}
function countdownHero(today){
  const race=PLAN.milestones[2];const n=diffDays(today,race.date);
  const nextM=PLAN.milestones.find(m=>m.date>=today&&m!==race);
  const start=PLAN.days[0].date;const wk=currentWeek(today);
  let sub=today<start?"Plan starts "+nice(start,{dow:1})+" · "+diffDays(today,start)+" day"+(diffDays(today,start)===1?"":"s"):wk?"Week "+wk.w+" of 30":"";
  return '<section class="hero"><div class="eyebrow">Marathon · '+nice(race.date,{dow:1,year:1})+'</div>'+
    (n>0?'<div class="cd"><span class="num">'+n+'</span><h2>day'+(n===1?"":"s")+' to go</h2></div>':n===0?'<h2>Race day!</h2>':'<h2>Marathon done</h2>')+
    '<div class="chips">'+(sub?'<span class="chip">'+esc(sub)+'</span>':'')+(nextM?'<span class="chip">'+esc(nextM.name)+' in '+diffDays(today,nextM.date)+' days</span>':'')+'</div></section>';

function todoItems(d){
  const it=[];
  if(d.kind==="rest")return [{k:"main",t:"Rest day",s:"Recovery is where the fitness happens."}];
  if(d.segs){
    const sum=k=>d.segs.filter(x=>x[0]===k).reduce((a,x)=>a+x[1],0);
    if(sum("warm"))it.push({k:"warm",t:"Warm-up walk "+sum("warm")+" min"});
    it.push({k:"main",t:d.title,s:d.detail});
    if(sum("cool"))it.push({k:"cool",t:"Cool-down walk "+sum("cool")+" min"});
  }else it.push({k:"main",t:d.title,s:d.detail});
  if(d.strength&&d.kind!=="strength")it.push({k:"strength",t:"Strength session",s:"20 to 30 min: calf raises, split squats, glute bridges, side planks."});
  return it;
}
function checksOf(date){const l=S.logs[date];if(!l)return {};if(l.checks)return l.checks;
  // older logs made before the checklist: treat a done log as all checked
  if(l.status==="done"){const d=PLAN.byDate[date];const o={};if(d)todoItems(d).forEach(i=>{if(i.k!=="strength"||l.strength)o[i.k]=true});return o}
  return {}}
function todoList(d){
  const c=checksOf(d.date);
  return '<div class="todo">'+todoItems(d).map(i=>'<label class="check'+(c[i.k]?" on":"")+'"><input type="checkbox" data-todo="'+d.date+'|'+i.k+'"'+(c[i.k]?" checked":"")+'><span><span class="t">'+esc(i.t)+'</span>'+(i.s?'<span class="s">'+esc(i.s)+'</span>':'')+'</span></label>').join("")+'</div>';
}
function toggleTodo(date,k,on){
  const d=PLAN.byDate[date];if(!d)return;
  const items=todoItems(d);const prev=S.logs[date]||{};
  const checks=Object.assign({},checksOf(date));if(on)checks[k]=true;else delete checks[k];
  const n=items.filter(i=>checks[i.k]).length;
  const hasDetails=prev.distance||prev.minutes||prev.avgHr||prev.watch||(prev.notes||"").trim();
  if(!n&&!hasDetails){writeLog(date,null);return}
  const status=n===items.length?"done":"partial";
  const log=Object.assign({},prev,{checks,status:n?status:(prev.status||"partial"),planned:d.title,strength:!!(checks.strength||(d.kind==="strength"&&checks.main)),updatedAt:Date.now()});
  if(log.pain==null)log.pain="none";
  if(RUNKINDS[d.kind]){
    if(log.status==="done"&&!log.distance&&!log.minutes){log.distance=d.miles||null;log.minutes=d.minutes||null;log.est=true}
    else if(log.status!=="done"&&log.est){log.distance=null;log.minutes=null;delete log.est}
  }
  writeLog(date,log);
  if(n===items.length&&on)toast(d.kind==="rest"?"Rest day done":"All done. Nice work!");
}

    '<div class="field"><span class="lab">How did it go?</span><div class="seg" id="fStatus">'+[["done","Done"],["partial","Partial"],["skipped","Skipped"]].map(o=>'<button type="button" data-v="'+o[0]+'" aria-pressed="'+(l.status===o[0])+'">'+o[1]+'</button>').join("")+'</div></div>'+
    '<div class="grid2"><div class="field"><label for="fDist">Distance (mi)</label><input id="fDist" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(l.distance)+'"></div><div class="field"><label for="fMin">Time (min)</label><input id="fMin" type="number" inputmode="decimal" step="1" min="0" value="'+esc(l.minutes)+'"></div></div>'+
    '<div class="grid2"><div class="field"><label for="fHr">Average HR (bpm)</label><input id="fHr" type="number" inputmode="numeric" min="60" max="230" value="'+esc(l.avgHr)+'"></div><div class="field"><label for="fPain">Any pain?</label><select id="fPain">'+[["none","None"],["sore","Soreness that eased"],["worse","Pain that got worse"],["sharp","Sharp pain on a bone"],["achilles","Achilles or heel pain"]].map(o=>'<option value="'+o[0]+'"'+(l.pain===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></div></div>'+
    '<div class="field"><span class="lab">Effort, 1 (easy) to 10 (all out)</span><div class="rpe" id="fRpe">'+Array.from({length:10},(_,i)=>'<button type="button" data-v="'+(i+1)+'" aria-pressed="'+(l.rpe===i+1)+'">'+(i+1)+'</button>').join("")+'</div></div>'+
    (showStr||RUNKINDS[d.kind]||d.kind==="strength"?'<label class="check"><input type="checkbox" id="fStr"'+(l.strength?" checked":"")+'><span>Strength session done</span></label>':'')+
    '<div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="How did your legs feel? Treadmill or outdoors?">'+esc(l.notes)+'</textarea></div>'+
    '<div class="btns"><button class="btn primary grow" id="fSave">Save</button>'+(S.logs[date]?'<button class="btn danger" id="fDel">Clear</button>':'')+'<button class="btn" id="fCancel">Cancel</button></div>');
  let status=l.status,rpe=l.rpe;
  const impBtn=s.querySelector("#fImp"),shotIn=s.querySelector("#fShot"),impBody=s.querySelector("#fImpBody");
  if(impBtn)impBtn.onclick=()=>shotIn.click();
  shotIn.onchange=async()=>{
    const files=Array.from(shotIn.files||[]).slice(0,4);shotIn.value="";if(!files.length)return;
    impBtn.disabled=true;impBody.innerHTML='<div class="small">Reading your screenshot. This takes about 10 to 30 seconds.</div>';
    try{
      const w=await sampler.json(IMPORT_PROMPT,{images:files});
      watch=cleanWatch(w);
      if(watch.distance_mi!=null)s.querySelector("#fDist").value=watch.distance_mi;
      if(watch.duration_min!=null)s.querySelector("#fMin").value=watch.duration_min;
      if(watch.avg_hr!=null)s.querySelector("#fHr").value=watch.avg_hr;
      if(assets){for(const f of files){try{const r=await assets.upload(f);shots.push(r.id)}catch(e){}}}
      impBody.innerHTML=watchBody(watch,shots)+(watch.date&&watch.date!==date?'<div class="small" style="color:var(--warn)">The screenshot looks like it\'s from '+esc(nice(watch.date,{dow:1}))+'. Check you are logging the right day.</div>':'')+'<div class="small muted">Check the numbers, then tap Save.</div>';
    }catch(e){
      const msg=e&&e.code==="not_granted"?"Claude wasn't allowed to read the screenshot. Allow it when asked, or type the numbers in.":e&&e.code==="image_rejected"?"That image couldn't be read. Try a PNG or JPEG screenshot.":e&&e.code==="rate_limited"?"Too many imports right now. Try again in a minute.":"Couldn't read that screenshot. Try again, or type the numbers in.";
      impBody.innerHTML=watchBody(watch,shots)+'<div class="small" style="color:var(--bad)">'+esc(msg)+'</div>';
    }finally{impBtn.disabled=false}
  };
  s.querySelectorAll("#fStatus button").forEach(b=>b.onclick=()=>{status=b.dataset.v;s.querySelectorAll("#fStatus button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  s.querySelectorAll("#fRpe button").forEach(b=>b.onclick=()=>{rpe=+b.dataset.v;s.querySelectorAll("#fRpe button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  s.querySelector("#fCancel").onclick=closeSheet;
  const del=s.querySelector("#fDel");if(del)del.onclick=()=>{closeSheet();writeLog(date,null);toast("Log cleared")};
  s.querySelector("#fSave").onclick=()=>{
    const num=id=>{const v=s.querySelector(id).value;return v===""?null:Math.round(parseFloat(v)*100)/100};
    const str=s.querySelector("#fStr");
    const log={status,distance:num("#fDist"),minutes:num("#fMin"),avgHr:num("#fHr"),rpe:rpe||null,pain:s.querySelector("#fPain").value,strength:str?str.checked:false,notes:s.querySelector("#fNotes").value.slice(0,1000),planned:d.title,watch:watch||null,shots:shots,updatedAt:Date.now()};
    closeSheet();writeLog(date,log);toast(status==="skipped"?"Marked skipped":"Saved. Nice work.");
  };
}
function quickDone(date){const d=PLAN.byDate[date];writeLog(date,{status:"done",distance:d.miles||null,minutes:d.minutes?d.minutes:null,avgHr:null,rpe:null,pain:"none",strength:!!d.strength,notes:"",planned:d.title,updatedAt:Date.now()});toast("Marked done. Add HR and effort with Edit log.")}

/* ---------- interval timer ---------- */
let T=null;
function beep(freqs){try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();const ac=T.ac;let t=ac.currentTime;freqs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.start(t);o.stop(t+.3);t+=.34})}catch(e){}}
function say(txt){try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(txt);u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
const SEGNAME={warm:"Warm-up walk",run:"Run",walk:"Walk",cool:"Cool-down walk"};
function openTimer(date){
  const d=PLAN.byDate[date];const segs=d.segs.map(s=>({k:s[0],sec:Math.round(s[1]*60)}));
  const total=segs.reduce((a,s)=>a+s.sec,0);
  T={date,d,segs,total,i:0,elapsedBefore:0,startedAt:null,running:false,ac:null,wake:null,iv:null,lastCue:-1};
  const el=document.createElement("div");el.className="timer walk";el.id="timer";el.setAttribute("role","dialog");
  el.innerHTML='<div class="row"><span class="eyebrow" style="color:inherit;opacity:.85">'+esc(d.title)+'</span><button class="btn small" id="tClose" style="background:rgba(255,255,255,.2);color:inherit">Close</button></div>'+
    '<div class="segs" id="tSegs">'+segs.map((s,i)=>'<i class="'+(s.k==="run"?"r":"")+'" style="flex:'+s.sec+'"></i>').join("")+'</div>'+
    '<div class="grow"></div><div class="seglabel" id="tLabel">Ready</div><div class="clock" id="tClock">0:00</div><div class="next" id="tNext"></div>'+
    '<div class="tbar"><i id="tBar" style="width:0%"></i></div><div class="tmeta"><span id="tEl">0:00 elapsed</span><span id="tRem"></span></div>'+
    '<div class="small" style="opacity:.9">Keep HR '+esc(zoneLabel("z2",zones(S.settings.maxHr)))+'. Walk if it climbs higher.</div>'+
    '<div class="tbtns"><button id="tBack">Back</button><button class="main" id="tGo">Start</button><button id="tSkip">Skip</button></div>';
  document.body.appendChild(el);
  el.querySelector("#tClose").onclick=()=>{if(T.elapsedTotal>60&&!T.finished){stopTimer();openLog(date,{minutes:Math.round((T.runSec||0)/60)||null,status:"partial"})}else stopTimer()};
  el.querySelector("#tGo").onclick=()=>{if(T.finished){const m=Math.round(T.runSec/60);stopTimer();openLog(date,{minutes:m,status:"done"});return}T.running?pause():play()};
  el.querySelector("#tSkip").onclick=()=>jump(1);
  el.querySelector("#tBack").onclick=()=>jump(-1);
  tick();
}
function segElapsed(){return T.elapsedBefore+(T.running?(Date.now()-T.startedAt)/1000:0)}
function play(){T.running=true;T.startedAt=Date.now();if(T.lastCue<0){cue()}
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>T.wake=w).catch(()=>{})}catch(e){}
  T.iv=setInterval(tick,250);tick()}
function pause(){T.elapsedBefore=segElapsed();T.running=false;clearInterval(T.iv);tick()}
function jump(dir){const wasRunning=T.running;if(wasRunning){clearInterval(T.iv)}T.i=Math.max(0,Math.min(T.segs.length-1,T.i+dir));T.elapsedBefore=0;T.startedAt=Date.now();T.lastCue=-1;if(wasRunning){cue();T.iv=setInterval(tick,250)}tick()}
function cue(){if(!T||T.lastCue===T.i)return;T.lastCue=T.i;const s=T.segs[T.i];const name=SEGNAME[s.k];
  beep(s.k==="run"?[880,880,1175]:[660,523]);setTimeout(()=>say(name+", "+fmtDur(s.sec,true)),900);}
function fmtDur(sec,words){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;if(words){return m?(m+" minute"+(m===1?"":"s")+(s?" "+s+" seconds":"")):s+" seconds"}return m+":"+String(s).padStart(2,"0")}
function tick(){
  if(!T)return;const el=$("#timer");if(!el)return;
  let e=segElapsed();
  while(T.running&&e>=T.segs[T.i].sec){ // advance
    const over=e-T.segs[T.i].sec;
    if(T.i>=T.segs.length-1){finish();return}
    T.i++;T.elapsedBefore=over;T.startedAt=Date.now();e=over;cue();
  }
  const s=T.segs[T.i];const rem=s.sec-e;
  const before=T.segs.slice(0,T.i).reduce((a,x)=>a+x.sec,0);T.elapsedTotal=before+e;
  T.runSec=T.segs.slice(0,T.i).filter(x=>x.k==="run").reduce((a,x)=>a+x.sec,0)+(s.k==="run"?e:0);
  el.className="timer "+(s.k==="run"?"run":"walk");
  $("#tLabel").textContent=T.running||T.elapsedTotal>0?SEGNAME[s.k]:"Ready";
  $("#tClock").textContent=fmtDur(rem);
  const nx=T.segs[T.i+1];$("#tNext").textContent=nx?"Next: "+SEGNAME[nx.k]+" "+fmtDur(nx.sec):"Last segment";
  $("#tBar").style.width=(T.elapsedTotal/T.total*100)+"%";
  $("#tEl").textContent=fmtDur(T.elapsedTotal)+" elapsed";$("#tRem").textContent=fmtDur(T.total-T.elapsedTotal)+" left";
  $("#tGo").textContent=T.running?"Pause":T.elapsedTotal>0?"Resume":"Start";
  el.querySelectorAll("#tSegs i").forEach((x,i)=>{x.classList.toggle("past",i<T.i);x.classList.toggle("cur",i===T.i)});
  if(rem<=3.2&&rem>0&&T.running&&T._c!==T.i+":"+Math.ceil(rem)){T._c=T.i+":"+Math.ceil(rem);beep([440])}
}
function finish(){clearInterval(T.iv);T.running=false;T.finished=true;beep([523,659,784,1047]);say("Workout complete. Nice work.");
  const el=$("#timer");el.className="timer done";$("#tLabel").textContent="Done";$("#tClock").textContent=fmtDur(T.total);$("#tNext").textContent=Math.round(T.runSec/60)+" min of running";$("#tBar").style.width="100%";$("#tGo").textContent="Log it";$("#tRem").textContent="";}
function stopTimer(){if(!T)return;clearInterval(T.iv);try{T.wake&&T.wake.release()}catch(e){}try{speechSynthesis.cancel()}catch(e){}const el=$("#timer");if(el)el.remove();T=null}

/* ---------- misc ---------- */
let toastT;function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
async function exportData(){
  const data=JSON.stringify({app:"stride-log",version:1,exportedAt:new Date().toISOString(),settings:S.settings,logs:S.logs},null,2);
  if(downloads){try{await downloads.save({filename:"stride-log-backup-"+todayStr()+".json",data});return}catch(e){if(e&&e.code==="cancelled")return}}
  try{const b=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stride-log-backup-"+todayStr()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}catch(e){}
  try{await navigator.clipboard.writeText(data);toast("Backup copied to clipboard")}catch(e){toast("Export isn't available here")}
}
function importData(file){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j||!j.logs)throw 0;
  for(const k of Object.keys(j.logs)){await writeLog(k,Object.assign({},j.logs[k],{updatedAt:j.logs[k].updatedAt||Date.now()}))}
  if(j.settings)await writeSettings(j.settings);toast("Imported "+Object.keys(j.logs).length+" entries")}catch(e){toast("That file isn't a Stride Log backup")}};r.readAsText(file)}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-prep]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.day){const d=PLAN.byDate[t.dataset.day];const today=todayStr();
    if(d&&d.segs&&d.date===today&&!S.logs[d.date]){openDay(d)}else openDay(d);return}
  if(t.dataset.log){openLog(t.dataset.log);return}
  if(t.dataset.quick){quickDone(t.dataset.quick);return}
  if(t.dataset.timer){openTimer(t.dataset.timer);return}
  if(t.dataset.week){const n=+t.dataset.week;openWeek=openWeek===n?-1:n;render();return}
  if(t.dataset.unrepeat){const w=+t.dataset.unrepeat;const r=(S.settings.repeats||[]).slice();const i=r.lastIndexOf(w);if(i>=0)r.splice(i,1);writeSettings({repeats:r});toast("Repeat removed. Race day is "+nice(buildPlan(Object.assign({},S.settings,{repeats:r})).end));return}
  if(t.dataset.coach!=null){const c=coach(todayStr())[+t.dataset.coach];if(c&&c.action&&c.action.fn==="repeat")repeatWeek(c.action.w);return}
  if(t.id==="repeatCur"){const cw=currentWeek(todayStr());if(cw)repeatWeek(cw.w);else toast("The plan hasn't started yet");return}
  if(t.id==="exportBtn"){exportData();return}
  if(t.id==="signInBtn"){showSignIn();return}
  if(t.id==="signUpBtn"){showSignIn(null,"up");return}
  if(t.id==="profBtn"){openProfile(false);return}
  if(t.id==="profStart"){openProfile(true);return}
  if(t.id==="acctBtn"){openAccountEdit();return}
  if(t.id==="delMe"){deleteMe();return}
  if(t.id==="invNew"){adminAct("newcode");return}
  if(t.id==="invCopy"){adminAct("copy");return}
  if(t.dataset.mreset){adminAct("reset",t.dataset.mreset);return}
  if(t.dataset.mdel){adminAct("del",t.dataset.mdel);return}
  if(t.id==="signOutBtn"){signOut();return}
  if(t.id==="pushBtn"){enablePush();return}
  if(t.id==="pushTest"){testPush();return}
  if(t.id==="pushOff"){writeSettings({remindTime:null});toast("Reminders off");return}
  if(t.id==="tokenBtn"){(async()=>{try{const u=await shortcutLink();if(!u)throw 0;try{await navigator.clipboard.writeText(u);toast("Link copied. Paste it into the Shortcut's URL step.")}catch(e){const s=openSheet('<h2>Shortcut link</h2><div class="small" style="word-break:break-all;user-select:all">'+esc(u)+'</div><div class="btns"><button class="btn" id="tkClose">Close</button></div>');s.querySelector("#tkClose").onclick=closeSheet}}catch(e){toast("Couldn't get the link. Try again.")}})();return}
  if(t.id==="importBtn"){$("#importFile").click();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.todo){const [dt,k]=t.dataset.todo.split("|");const lab=t.closest(".check");if(lab)lab.classList.toggle("on",t.checked);toggleTodo(dt,k,t.checked);return}
  if(t.dataset&&t.dataset.prep){const p=Object.assign({},S.logs["_prep"]||{});p[t.dataset.prep]=t.checked;p.updatedAt=Date.now();p.status="prep";writeLog("_prep",p);return}
  if(t.id==="setStart"){const v=t.value;if(!v)return;const d=parse(v);if(d.getDay()!==1){toast("Pick a Monday so weeks line up");t.value=S.settings.startDate;return}writeSettings({startDate:v});toast("Plan now starts "+nice(v))}
  if(t.id==="setMax"){const v=parseInt(t.value,10);if(v>=150&&v<=230){writeSettings({maxHr:v});toast("Zones updated")}}
  if(t.id==="setRemind"){writeSettings({remindTime:t.value||null});toast(t.value?"Reminders at "+t.value:"Reminders off");return}
  if(t.id==="setRest"){const v=parseInt(t.value,10);writeSettings({restHr:v>=30&&v<=100?v:null})}
  if(t.id==="importFile"&&t.files&&t.files[0]){importData(t.files[0]);t.value=""}
});
function repeatWeek(w){const r=(S.settings.repeats||[]).concat([w]);writeSettings({repeats:r});const end=buildPlan(Object.assign({},S.settings,{repeats:r})).end;toast("Week "+w+" repeats. Race day moves to "+nice(end))}
function openDay(d){
  if(!d)return;
  const s=openSheet('<div class="eyebrow">'+nice(d.date,{dow:1,year:1})+' · Week '+d.w+'</div><h2>'+esc(d.title)+'</h2>'+todoList(d)+
    '<div class="btns">'+(d.segs&&d.date===todayStr()?'<button class="btn primary grow" id="xTimer">Interval timer</button>':'')+'<button class="btn grow" id="xClose">Done</button></div>'+
    '<div style="text-align:center"><button class="btn small ghost" id="xLog">Add details (optional)</button></div>');
  s.querySelector("#xClose").onclick=closeSheet;
  s.querySelector("#xLog").onclick=()=>openLog(d.date);
  const tb=s.querySelector("#xTimer");if(tb)tb.onclick=()=>{closeSheet();openTimer(d.date)};
}

loadLocal();PLAN=buildPlan(S.settings);render();connect();
// refresh at midnight / when returning to the app
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!T)render()});
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
