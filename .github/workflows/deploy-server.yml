name: Deploy server
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        id: check
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_PASSWORD; do [ -z "${!s}" ] && missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy until these secrets are added:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        name: Find or create the database
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="stride-log") | (.uuid // .id)' | head -1; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create stride-log; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "::error::Couldn't find or create the D1 database"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - if: steps.check.outputs.ready == 'true'
        name: Set up tables
        run: npx wrangler d1 execute stride-log --remote --file schema.sql
      - if: steps.check.outputs.ready == 'true'
        name: Deploy
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - if: steps.check.outputs.ready == 'true'
        name: Set secrets
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
      - if: steps.check.outputs.ready == 'true'
        name: Save the server address in the app
        run: |
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::warning::No workers.dev address found. Pick a workers.dev subdomain in the Cloudflare dashboard, then run this again."; exit 0; fi
          echo "Server: $URL" >> "$GITHUB_STEP_SUMMARY"
          cd ..
          printf '// Filled in by the deploy workflow.\nwindow.STRIDE_CONFIG = {\n  apiUrl: "%s"\n};\n' "$URL" > config.js
          if ! git diff --quiet config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Point the app at $URL" config.js && git push
          fi
